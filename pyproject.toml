[project]
name = "bitcompute"
version = "0.1.0"
description = "BitTorrent-style swarm for distributed training & inference compute"
requires-python = ">=3.10"
dependencies = ["libtorrent>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]
llm = ["llama-cpp-python"]

[project.scripts]
bitcompute = "bitcompute.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
